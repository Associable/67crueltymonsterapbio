<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Biochem Drill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow reading column. Home is a topic grid; quiz and free-response screens swap in below the header. */
:root{
  --display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --bg:#F2F5F8; --surface:#FFFFFF; --ink:#12202E; --muted:#54677A; --line:#D3DDE7;
  --accent:#2457C5; --accent-ink:#FFFFFF; --accent-soft:#E3ECFB;
  --good:#1B7F4B; --good-soft:#E1F4E9; --bad:#B3261E; --bad-soft:#FBE6E4;
  --c-carbon:#5B6B7C; --c-polymers:#2E8B57; --c-carbs:#B86E00; --c-lipids:#C2410C;
  --c-proteins:#7C4DCC; --c-nucleic:#0F8A8A; --c-enzymes:#B83280;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E161F; --surface:#16212D; --ink:#E6EDF4; --muted:#93A5B8; --line:#2A3949;
  --accent:#7BA3FF; --accent-ink:#0E161F; --accent-soft:#1D2C48;
  --good:#5FD08F; --good-soft:#12301F; --bad:#FF8A80; --bad-soft:#3A1A18;
  --c-carbon:#9FB0C2; --c-polymers:#5FD08F; --c-carbs:#F0A23B; --c-lipids:#FF8A5C;
  --c-proteins:#B79BFF; --c-nucleic:#4FD1D1; --c-enzymes:#FF7FC0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E161F; --surface:#16212D; --ink:#E6EDF4; --muted:#93A5B8; --line:#2A3949;
  --accent:#7BA3FF; --accent-ink:#0E161F; --accent-soft:#1D2C48;
  --good:#5FD08F; --good-soft:#12301F; --bad:#FF8A80; --bad-soft:#3A1A18;
  --c-carbon:#9FB0C2; --c-polymers:#5FD08F; --c-carbs:#F0A23B; --c-lipids:#FF8A5C;
  --c-proteins:#B79BFF; --c-nucleic:#4FD1D1; --c-enzymes:#FF7FC0; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--body);padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:880px;margin-inline:auto;display:flex;flex-direction:column;gap:28px}
button{font:inherit;color:inherit}
sub,sup{line-height:0}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px}
.brand{background:none;border:0;padding:0;text-align:left;cursor:pointer}
.brand h1{font:700 1.9rem/1.05 var(--display);letter-spacing:-.01em;margin:0}
.brand p{margin:4px 0 0;color:var(--muted);font-size:.9rem}
.stats{font:400 .78rem/1.4 var(--mono);color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.stats b{color:var(--ink);font-weight:500}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:.6rem 1rem;font-weight:500;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn:focus-visible,.opt:focus-visible,.topic:focus-visible,.brand:focus-visible,textarea:focus-visible,.rub input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.lead{margin:0;max-width:62ch;color:var(--muted)}
.lead strong{color:var(--ink);font-weight:600}
h2{font:700 1.25rem/1.2 var(--display);margin:0}
.sec{display:flex;flex-direction:column;gap:14px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec-h span{color:var(--muted);font-size:.85rem}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.topic{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--tc);border-radius:6px;padding:14px 14px 12px;cursor:pointer;min-width:0}
.topic:hover{border-color:var(--tc)}
.motif{font:500 .95rem/1.3 var(--mono);color:var(--tc);overflow-wrap:anywhere}
.topic h3{margin:0;font:600 1.05rem/1.25 var(--body)}
.meta{color:var(--muted);font-size:.82rem;margin-top:auto}

.frqlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.frqcard{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;cursor:pointer}
.frqcard:hover{border-color:var(--accent)}
.frqcard strong{font-weight:600}
.frqcard span{color:var(--muted);font-size:.82rem}

.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chip{font:500 .74rem/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--tc);display:inline-flex;align-items:center;gap:7px}
.chip::before{content:"";width:9px;height:9px;background:var(--tc);border-radius:2px}
.count{font:400 .8rem var(--mono);color:var(--muted)}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.stem{font:500 1.15rem/1.5 var(--body);margin:0;max-width:66ch}
.instr{font:500 .78rem var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--accent);margin:0}
.tblwrap{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;font:400 .9rem var(--mono);font-variant-numeric:tabular-nums;background:var(--surface);border:1px solid var(--line)}
caption{caption-side:top;text-align:left;font:500 .8rem var(--body);color:var(--muted);padding:0 0 6px}
th,td{padding:.4rem .8rem;border:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{background:var(--accent-soft);font-weight:500}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:1.8rem 1fr;gap:12px;align-items:start;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:.75rem .9rem;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .ltr{font:500 .8rem var(--mono);width:1.7rem;height:1.7rem;display:grid;place-items:center;border:1px solid var(--line);border-radius:4px;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .ltr{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt:disabled{cursor:default;color:var(--ink)}
.opt.good{border-color:var(--good);background:var(--good-soft)}
.opt.good .ltr{background:var(--good);border-color:var(--good);color:var(--bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .ltr{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.otxt{min-width:0;overflow-wrap:anywhere;padding-top:.15rem}
.tag{display:block;margin-top:4px;font:500 .72rem var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.opt.good .tag{color:var(--good)} .opt.bad .tag{color:var(--bad)}
.fb{border-left:4px solid var(--line);background:var(--surface);padding:12px 16px;border-radius:0 6px 6px 0}
.fb.good{border-color:var(--good)} .fb.bad{border-color:var(--bad)}
.fb strong{font-family:var(--display);font-size:1.05rem}
.fb.good strong{color:var(--good)} .fb.bad strong{color:var(--bad)}
.fb p{margin:4px 0 0;max-width:66ch}
.kbd{color:var(--muted);font-size:.78rem}

.score{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.score b{font:700 3.2rem/1 var(--display);font-variant-numeric:tabular-nums}
.score span{font:400 1rem var(--mono);color:var(--muted)}
.tb{display:grid;grid-template-columns:minmax(0,12rem) 1fr 3.2rem;gap:10px;align-items:center;font-size:.9rem}
.tb .bar{height:8px}
.tb .bar i{background:var(--tc)}
.tb em{font:400 .8rem var(--mono);font-style:normal;text-align:right;color:var(--muted)}
@media (max-width:520px){.tb{grid-template-columns:1fr 3.2rem}.tb .bar{grid-column:1/-1;grid-row:2}}
.miss{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.miss .stem{font-size:1rem}
.miss p{margin:0}
.miss .ca{color:var(--good);font-weight:500}

.part{display:flex;flex-direction:column;gap:6px}
.part p{margin:0;max-width:68ch}
.pts{font:400 .75rem var(--mono);color:var(--muted);margin-left:6px}
textarea{width:100%;min-height:5.5rem;resize:vertical;font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:.6rem .75rem}
.guide{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px}
.rub{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.rub input{margin-top:.35rem;width:1.05rem;height:1.05rem;accent-color:var(--accent)}
.rub label{cursor:pointer}
.rub small{display:block;color:var(--muted);font-size:.85rem;margin-top:2px}
.model{border-top:1px solid var(--line);padding-top:12px;margin:0;max-width:68ch}
.selfscore{font:500 .9rem var(--mono)}
footer{color:var(--muted);font-size:.8rem;border-top:1px solid var(--line);padding-top:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer p{margin:0;max-width:60ch}
.link{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.8rem}
.ai{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.ai-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.ai-h strong{font:700 1.05rem var(--display);color:var(--accent)}
.ai-h span{font-size:.78rem;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chipbtn{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:.3rem .85rem;font-size:.85rem;cursor:pointer}
.chipbtn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.chipbtn:disabled{opacity:.45;cursor:not-allowed}
.chipbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.thread{display:flex;flex-direction:column;gap:12px}
.bub{display:flex;flex-direction:column;gap:2px;max-width:70ch}
.bub small{font:500 .7rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bub p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.bub.me p{color:var(--muted)}
.aiform{display:flex;gap:8px;flex-wrap:wrap}
.aiform input{flex:1 1 14rem;min-width:0;font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:.5rem .7rem}
.aiform input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.aierr{color:var(--bad);font-size:.85rem;margin:0}
.aibadge{font:500 .68rem var(--mono);letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--accent);color:var(--accent);border-radius:3px;padding:1px 6px;margin-left:6px}
.gen{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px}
.gen select{font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:.55rem .7rem;max-width:100%}
.gen select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <button class="brand" data-act="home" aria-label="Biochem Drill home">
      <h1>Biochem Drill</h1>
      <p>AP Biology · Chemistry of life</p>
    </button>
    <div class="stats" id="stats"></div>
  </header>
  <main id="app"></main>
  <footer>
    <p>Built-in questions are original and written in AP Biology style, testing the concepts behind your notes. Anything written by Claude is labeled AI and can contain mistakes, so check it against your textbook.</p>
    <button class="link" data-act="reset" id="resetBtn">Clear saved progress</button>
  </footer>
</div>

<script>
/* ---------- DATA ---------- */
const TOPICS=[
 {id:"carbon",name:"Carbon & Functional Groups",motif:"CH<sub>4</sub> · –COOH · –NH<sub>2</sub>"},
 {id:"polymers",name:"Polymers: Building & Breaking",motif:"n monomers → polymer + (n−1) H<sub>2</sub>O"},
 {id:"carbs",name:"Carbohydrates",motif:"C<sub>6</sub>H<sub>12</sub>O<sub>6</sub>"},
 {id:"lipids",name:"Lipids & Steroids",motif:"C<sub>57</sub>H<sub>110</sub>O<sub>6</sub>"},
 {id:"proteins",name:"Proteins & Folding",motif:"–CO–NH– peptide bond"},
 {id:"nucleic",name:"Nucleic Acids & Nucleotides",motif:"A=T · G≡C"},
 {id:"enzymes",name:"Enzymes",motif:"E + S ⇌ ES → E + P"}
];
const BANK=[];
function add(topic,q,opts,ans,exp,table){BANK.push({id:BANK.length,topic,q,opts,ans,exp,table:table||null,multi:Array.isArray(ans)})}

/* Carbon & functional groups */
add("carbon","Carbon is the structural backbone of biological molecules mainly because a carbon atom",
 ["has four valence electrons and can form up to four covalent bonds with many different atoms","has a permanent positive charge that attracts negatively charged groups","forms ionic bonds with hydrogen and oxygen more readily than any other element","has two valence electrons that allow it to form long chains through hydrogen bonds"],0,
 "Four valence electrons let carbon share electrons in up to four covalent bonds. That makes chains, branches, and rings possible, with H, O, N, P, S, and other carbons as partners.");
add("carbon","Propane (C<sub>3</sub>H<sub>8</sub>) and propene (C<sub>3</sub>H<sub>6</sub>) are both hydrocarbons. Which statement correctly compares them?",
 ["Propene is unsaturated because it contains a carbon–carbon double bond, so its carbons hold fewer hydrogens than the maximum possible.","Propene is saturated because every carbon in it still forms four covalent bonds.","Propane is unsaturated because all of its bonds are single bonds.","Propane and propene must have identical shapes because both contain only carbon and hydrogen."],0,
 "Saturation refers to how many hydrogens a carbon skeleton holds. A double bond means fewer hydrogens, so propene is unsaturated. A C=C bond also changes shape, because it is rigid and holds atoms in a fixed geometry.");
add("carbon","Which pair of functional groups is found in every amino acid?",
 ["Amino and carboxyl","Hydroxyl and sulfhydryl","Phosphate and methyl","Carbonyl and phosphate"],0,
 "Every amino acid has an amino group (–NH<sub>2</sub>), a carboxyl group (–COOH), a hydrogen, and a variable R group on the central carbon.");
add("carbon","Which functional group can release a hydrogen ion in solution and therefore gives an organic molecule acidic properties?",
 ["Carboxyl (–COOH)","Methyl (–CH<sub>3</sub>)","Amino (–NH<sub>2</sub>)","Carbonyl (C=O)"],0,
 "A carboxyl group donates H<sup>+</sup> and becomes –COO<sup>−</sup>, which is why these molecules are called acids. An amino group tends to accept H<sup>+</sup> (a base). Methyl and carbonyl groups do not behave as acids in cells.");
add("carbon","Glucose and fructose both have the molecular formula C<sub>6</sub>H<sub>12</sub>O<sub>6</sub>, but their atoms are connected differently and they have different properties. These two molecules are best described as",
 ["structural isomers","isotopes","stereoisomers","a monomer and its polymer"],0,
 "Isomers share a molecular formula but differ in structure. Glucose and fructose differ in how their atoms are connected (where the carbonyl sits), so they are structural isomers. Stereoisomers share the same connections and differ only in 3-D orientation.");
add("carbon","A sugar's carbonyl group is bonded to a carbon in the interior of the carbon chain rather than to a carbon at the end. This sugar is best classified as",
 ["a ketose","an aldose","a disaccharide","a polysaccharide"],0,
 "A carbonyl on an interior carbon makes a ketone, so the sugar is a ketose. A carbonyl at the end of the chain makes an aldehyde, so the sugar is an aldose.");
add("carbon","A researcher attaches several hydroxyl groups to a nonpolar organic molecule. What is the most likely effect?",
 ["Its solubility in water increases because –OH groups are polar and can form hydrogen bonds with water.","Its solubility in water decreases because –OH groups are nonpolar.","Its solubility does not change because only the carbon skeleton determines polarity.","It becomes an ionic compound and stops being organic."],0,
 "The O–H bond is polar, so hydroxyl groups make a molecule more hydrophilic. Functional groups largely determine a molecule's chemical behavior.");
add("carbon","Which of the following is a hydrocarbon?",
 ["CH<sub>4</sub>","CO<sub>2</sub>","C<sub>6</sub>H<sub>12</sub>O<sub>6</sub>","NH<sub>2</sub>CH<sub>2</sub>COOH"],0,
 "A hydrocarbon contains only carbon and hydrogen. CO<sub>2</sub> has no hydrogen, and the sugar and the amino acid also contain oxygen (and nitrogen).");
add("carbon","Which TWO statements about carbon skeletons are correct?",
 ["Carbon skeletons can be unbranched chains, branched chains, or rings.","A carbon–carbon double bond allows the atoms on either side to rotate freely.","Double bonds in a hydrocarbon chain can introduce bends in the molecule.","Carbon skeletons in biological molecules are always unbranched."],[0,2],
 "Skeletons form chains, branches, and rings. A double bond is rigid and can put a bend in a chain, as in unsaturated fatty acids. Double bonds do not rotate freely.");

/* Polymers */
add("polymers","When two glucose molecules join to form maltose, which other molecule is produced?",
 ["Water","Carbon dioxide","Oxygen","ATP"],0,
 "Joining monomers is a dehydration (condensation) reaction. Atoms equal to one H<sub>2</sub>O are removed from the monomers, and a covalent bond forms.");
add("polymers","Which description best fits a hydrolysis reaction?",
 ["A water molecule is added as the covalent bond between two monomers is broken.","A water molecule is removed as a covalent bond forms between two monomers.","Two polymers are joined directly with no change in the number of atoms.","A monomer is rearranged into an isomer without any bonds being broken."],0,
 "Hydrolysis means breaking with water. The H and OH from water end up on the two new, separate molecules, converting a polymer into smaller units.");
add("polymers","A ribosome links 50 amino acids into a single polypeptide. How many water molecules are released while this chain is built?",
 ["49","50","51","25"],0,
 "Each peptide bond releases one water. Joining 50 monomers in a line takes 49 bonds, so 49 waters are released (n − 1).");
add("polymers","Which monomer–polymer pair is correctly matched?",
 ["Glucose – glycogen","Amino acid – DNA","Nucleotide – starch","Glycerol – protein"],0,
 "Glucose monomers make glycogen, starch, and cellulose. Amino acids make proteins, and nucleotides make nucleic acids.");
add("polymers","Triglycerides are in the lipid group but are not considered true polymers. Which statement best explains why?",
 ["They are not built as a long chain of repeating, similar monomers.","They are held together by hydrogen bonds instead of covalent bonds.","They contain no carbon atoms in their backbone.","They form without removing any water."],0,
 "A triglyceride is one glycerol with three fatty acids attached. That is a small assembled molecule, not a repeating chain. The ester bonds are covalent and form by dehydration synthesis.");
add("polymers","Which of the following is an anabolic process?",
 ["Synthesis of a protein from amino acids","Digestion of starch into glucose","Hydrolysis of glycogen during exercise","Breakdown of a triglyceride into glycerol and fatty acids"],0,
 "Anabolic reactions build larger molecules from smaller ones. The other three options break polymers or larger molecules down (catabolic).");
add("polymers","Researchers hydrolyze a dipeptide in water made with heavy oxygen (<sup>18</sup>O). Which result would best support the idea that water is a reactant in hydrolysis?",
 ["<sup>18</sup>O is found in the carboxyl group of one of the released amino acids.","<sup>18</sup>O is found in the R groups of both amino acids.","<sup>18</sup>O is found only in released carbon dioxide.","<sup>18</sup>O is not found in any product."],0,
 "In hydrolysis the OH from water attaches to the carbonyl carbon (becoming part of a carboxyl group) and the H attaches to the nitrogen. The labeled oxygen therefore appears in a carboxyl group.");
add("polymers","Glycosidic bonds, peptide bonds, and phosphodiester bonds are alike in that each",
 ["is a covalent bond formed when water is removed during polymer synthesis","is a hydrogen bond between neighboring monomers","forms only in lipids","is broken when a water molecule is removed"],0,
 "All three link monomers by dehydration synthesis (carbohydrates, proteins, and nucleic acids). Adding water, not removing it, breaks them.");
add("polymers","Which TWO events occur during a dehydration synthesis reaction?",
 ["A covalent bond forms between two monomers.","A water molecule is consumed.","A water molecule is released.","A polymer is split into its monomers."],[0,2],
 "Dehydration synthesis forms a covalent bond and releases water. Consuming water and splitting polymers describe hydrolysis.");

/* Carbohydrates */
add("carbs","A monosaccharide has five carbon atoms and the general formula (CH<sub>2</sub>O)<sub>n</sub>. What is its molecular formula?",
 ["C<sub>5</sub>H<sub>10</sub>O<sub>5</sub>","C<sub>5</sub>H<sub>12</sub>O<sub>5</sub>","C<sub>5</sub>H<sub>5</sub>O<sub>10</sub>","C<sub>10</sub>H<sub>5</sub>O<sub>5</sub>"],0,
 "(CH<sub>2</sub>O)<sub>n</sub> means a 1 : 2 : 1 ratio of C : H : O. With n = 5 you get C<sub>5</sub>H<sub>10</sub>O<sub>5</sub> (a pentose).");
add("carbs","Humans digest starch easily but cannot digest cellulose, even though both are polymers of glucose. The best explanation is that",
 ["human enzymes can hydrolyze α-glycosidic linkages in starch but cannot break the β-glycosidic linkages in cellulose","cellulose is made of fructose rather than glucose","starch has no covalent bonds between its monomers","cellulose is a lipid"],0,
 "Starch has α linkages and cellulose has β linkages. The glucose units are the same, but the shape of the link differs. Enzymes are specific, and human amylase does not fit β linkages.");
add("carbs","Which polysaccharide is stored in the liver and muscle cells of animals as a quick-access energy reserve?",
 ["Glycogen","Cellulose","Chitin","Peptidoglycan"],0,
 "Glycogen is the highly branched glucose polymer animals use to store energy. Starch plays that role in plants, while cellulose, chitin, and peptidoglycan are structural.");
add("carbs","A fungal cell wall and the exoskeleton of an insect both contain which polysaccharide?",
 ["Chitin","Cellulose","Glycogen","Amylose"],0,
 "Chitin is a modified polysaccharide used for structural support in fungal cell walls and arthropod exoskeletons.");
add("carbs","Penicillin blocks the synthesis of peptidoglycan. Which cells would be most directly harmed by this drug?",
 ["Bacterial cells","Human skin cells","Plant leaf cells","Human red blood cells"],0,
 "Peptidoglycan is a modified polysaccharide in bacterial cell walls. Animal cells have no cell wall, and plant cell walls are made of cellulose, so they are not targeted.");
add("carbs","A person lacks the enzyme lactase. After drinking milk, which process is most directly affected?",
 ["Hydrolysis of lactose into glucose and galactose","Dehydration synthesis of glycogen from glucose","Formation of peptide bonds in milk proteins","Hydrolysis of triglycerides into fatty acids"],0,

add("carbs","Glucose and galactose have the same connections between atoms and differ only in the orientation of the –OH group on carbon 4. These molecules are best described as",
 ["stereoisomers","structural isomers","a monomer and a polymer","a ketose and an aldose"],0,
 "Same atom connections but a different 3-D arrangement makes them stereoisomers. Both are aldoses.");
add("carbs","Sucrose forms when glucose and fructose are joined. Which statement correctly describes this?",
 ["A glycosidic bond forms and a molecule of water is released.","A peptide bond forms and a molecule of water is consumed.","A phosphodiester bond forms and carbon dioxide is released.","A glycosidic bond forms and a molecule of water is consumed."],0,

add("carbs","Which TWO of the following are polymers of glucose?",

add("carbs","Cows and termites feed on plant material but cannot make cellulase themselves. They thrive because",
 ["microbes in their digestive tracts produce enzymes that hydrolyze the β-glycosidic bonds of cellulose","cellulose is converted into starch by stomach acid","their cells contain chitin that digests plant fiber","cellulose is absorbed whole and used as an energy source"],0,
 "Gut microbes supply the enzymes that can break β-1,4 linkages and release glucose that the host can use.");

/* Lipids */
add("lipids","Which statement correctly describes the structure of a triglyceride?",
 ["One glycerol molecule joined to three fatty acids","Three glycerol molecules joined to one fatty acid","A chain of many amino acids","Four fused carbon rings with a hydroxyl group"],0,
 "A triglyceride is glycerol (a three-carbon alcohol) bonded to three fatty acid chains by ester linkages, formed by dehydration synthesis.");
add("lipids","Butter is solid at room temperature, but olive oil is liquid. Which explanation is best?",
 ["Butter is rich in saturated fatty acids whose straight chains pack tightly, while oils contain unsaturated fatty acids whose bends prevent tight packing.","Butter is made of protein and olive oil is made of carbohydrate.","Butter contains more double bonds, which pack together more tightly.","Olive oil is polar and dissolves in water, so it cannot form a solid."],0,

add("lipids","In water, phospholipids spontaneously assemble into a bilayer. This arrangement forms because",
 ["hydrophobic tails cluster away from water while polar heads face the water","the polar heads are repelled by water and face each other","fatty acid tails form hydrogen bonds with water on both sides","the glycerol backbone is nonpolar and orients toward the interior"],0,
 "Hydrophilic phosphate-containing heads face the watery surroundings, and hydrophobic fatty acid tails are sheltered in the interior. No energy input is needed.");
add("lipids","A student compares 18-carbon fatty acids that differ only in the number of double bonds. Which conclusion is best supported by the data?",
 ["As the number of C=C double bonds increases, the melting point decreases.","As the number of C=C double bonds increases, the melting point increases.","Melting point is unrelated to the number of double bonds.","All 18-carbon fatty acids are solid at 20 °C."],0,
 "Each double bond adds a kink that disrupts packing, so less energy is needed to melt the fat. Stearic acid melts well above room temperature while oleic and linoleic acids melt below it.",
 {cap:"Melting points of 18-carbon fatty acids",head:["Fatty acid","C=C bonds","Melting point (°C)"],rows:[["Stearic","0","69.6"],["Oleic","1","13.4"],["Linoleic","2","−5.0"],["Linolenic","3","−11.0"]]});
add("lipids","Cholesterol is classified as a lipid because it",
 ["is largely hydrophobic and has a skeleton of four fused carbon rings","is a polymer of fatty acids joined by ester bonds","contains peptide bonds between its monomers","consists of glycerol joined to three fatty acids"],0,
 "Steroids share a four-ring carbon skeleton and are mostly nonpolar. Cholesterol is also the starting point for other steroids, including sex hormones.");
add("lipids","On a per-gram basis, fats release more energy than carbohydrates. This is mainly because fats",
 ["contain many C–H bonds and relatively few oxygen atoms","contain many more oxygen atoms per carbon","are made of nucleotides","have stronger hydrogen bonds between molecules"],0,
 "Fats are more reduced, with many energy-rich C–H bonds. Carbohydrates are already partly oxidized (about 4 kcal/g versus about 9 kcal/g for fats).");
add("lipids","Testosterone and estrogen are both synthesized from which molecule?",
 ["Cholesterol","Glycerol","Glucose","Phospholipid"],0,
 "Steroid hormones are built from cholesterol, which provides the four-ring skeleton.");
add("lipids","Food manufacturers partially hydrogenate liquid vegetable oil to produce a spreadable solid. What chemical change makes the oil more solid?",
 ["Hydrogen is added across some C=C double bonds, converting them to single bonds and reducing bends.","Water is added to break ester bonds in the triglyceride.","Peptide bonds form between fatty acids.","Phosphate groups are added to the glycerol."],0,
 "Adding H across double bonds makes chains straighter and more saturated, so they pack more tightly and the melting point rises.");
add("lipids","Which TWO are functions of lipids in organisms?",
 ["Long-term energy storage","Forming the structural framework of cell membranes","Storing hereditary information","Serving as the main catalyst for most cell reactions"],[0,1],
 "Fats store energy and phospholipids form membranes. Nucleic acids store genetic information and most catalysts are proteins (enzymes).");
add("lipids","Bile acids help digest dietary fat in the small intestine. They are effective because each molecule",
 ["has both polar and nonpolar regions, which lets it break large fat droplets into smaller ones","is a polymer of glucose that hydrolyzes fat","is a hydrophilic protein that fits the active site of triglycerides","is entirely nonpolar and dissolves fat in water"],0,
 "Bile acids are steroid-based emulsifiers. Their nonpolar side interacts with fats and their polar side with water, which increases the surface area for lipases to act.");

/* Proteins */
add("proteins","A peptide bond forms between",
 ["the carboxyl group of one amino acid and the amino group of another","the R groups of two amino acids","the phosphate groups of two nucleotides","two glucose molecules"],0,

add("proteins","The 20 amino acids used in proteins differ from one another in",
 ["their R groups (side chains)","their amino groups","their carboxyl groups","the number of peptide bonds they contain"],0,
 "The amino group, carboxyl group, and hydrogen are the same on all 20. The R group varies and can be nonpolar, polar, acidic, or basic.");
add("proteins","In sickle-cell disease, one amino acid in the β chain of hemoglobin is changed from glutamic acid (polar, charged) to valine (nonpolar). Which statement best explains how one change can reduce function?",

add("proteins","Alpha helices and beta pleated sheets are examples of secondary structure. These patterns are held together mainly by hydrogen bonds between",

 "Secondary structure comes from hydrogen bonding between backbone amino and carbonyl groups. R groups drive tertiary structure.");
add("proteins","Which interaction between amino acid side chains forms a covalent bond that can stabilize tertiary structure?",
 ["A disulfide bridge between two cysteine residues","A hydrogen bond between two backbone atoms","A hydrophobic interaction between nonpolar R groups","An ionic bond between oppositely charged R groups"],0,
 "Two sulfhydryl groups (–SH) on cysteines can join to form a disulfide bridge (–S–S–), a covalent bond between R groups. The other interactions are weaker, noncovalent forces.");
add("proteins","Hemoglobin consists of four polypeptide chains that associate to form one functional protein. This level of organization is called",
 ["quaternary structure","primary structure","secondary structure","tertiary structure"],0,
 "Quaternary structure is the association of two or more polypeptide subunits. A single folded chain has only tertiary structure.");
add("proteins","Heating an egg white causes the clear liquid to turn into an opaque solid. Which explanation is best?",
 ["Heat disrupts weak interactions, so the proteins unfold (denature), while their amino acid sequence stays intact.","Heat breaks every peptide bond and turns proteins into amino acids.","Heat converts the proteins into lipids.","Heat adds new amino acids to the polypeptide chains."],0,

add("proteins","A transmembrane protein has a region that spans the hydrophobic interior of a phospholipid bilayer. Which type of R group is most likely to be found in that region?",
 ["Nonpolar","Polar uncharged","Positively charged","Negatively charged"],0,
 "Nonpolar R groups interact favorably with the hydrophobic fatty acid tails, while polar and charged groups would be found in regions exposed to water.");
add("proteins","Chaperone proteins in a cell most directly help by",
 ["assisting newly made polypeptides in folding into their correct three-dimensional shape","adding amino acids to the end of a growing chain","copying DNA before cell division","hydrolyzing starch into glucose"],0,
 "Chaperones help proteins reach and keep the right shape, which is needed for function.");
add("proteins","A purified enzyme is treated with urea and a reducing agent and loses all activity. When both chemicals are removed, activity returns. What is the best conclusion?",
 ["The amino acid sequence contains the information needed to specify the protein's folded shape.","The enzyme's primary structure was destroyed and then rebuilt by the cell.","Folding requires ATP to be added from outside the system.","Peptide bonds were broken by the urea and re-formed on their own."],0,
 "This is the classic Anfinsen result: the unfolded chain refolds spontaneously into its functional form because the sequence dictates the shape.");
add("proteins","Which TWO are functions of proteins?",
 ["Transporting substances, as hemoglobin carries oxygen","Defending the body, as antibodies do","Storing hereditary information","Serving as the primary long-term energy reserve of animals"],[0,1],
 "Proteins carry out transport, defense, structure, signaling, and catalysis. DNA stores hereditary information and fats serve as long-term energy stores.");

/* Nucleic acids */
add("nucleic","Each monomer of a nucleic acid contains",
 ["a five-carbon sugar, a phosphate group, and a nitrogenous base","an amino group, a carboxyl group, and an R group","glycerol and three fatty acids","a carbonyl group and several hydroxyl groups only"],0,
 "A nucleotide has a pentose sugar (deoxyribose or ribose), a phosphate group, and a nitrogenous base.");
add("nucleic","Which pair of nitrogenous bases consists of two purines?",
 ["Adenine and guanine","Cytosine and thymine","Thymine and uracil","Guanine and cytosine"],0,
 "Purines (A and G) have a double-ring structure. Pyrimidines (C, T, and U) have a single ring.");
add("nucleic","One strand of DNA has the sequence 5′-ATGC-3′. Which sequence is the complementary strand?",
 ["3′-TACG-5′","5′-TACG-3′","3′-UACG-5′","5′-ATGC-3′"],0,
 "A pairs with T and G pairs with C, and the two strands run antiparallel, so the partner reads 3′-TACG-5′. DNA does not contain uracil.");
add("nucleic","In a double-stranded DNA molecule, 22% of the nitrogenous bases are guanine. What percentage of the bases are adenine?",
 ["28%","22%","56%","78%"],0,
 "G pairs with C, so C is also 22%, which makes G + C = 44%. The remaining 56% is A + T, split evenly, so A = 28%.");
add("nucleic","Which feature is found in RNA but not in DNA?",
 ["The base uracil","The base thymine","Phosphate groups","Hydrogen-bonded base pairs between two strands in all RNAs"],0,
 "RNA contains ribose and uracil in place of deoxyribose and thymine. Phosphate groups are found in both, and RNA is usually single-stranded.");
add("nucleic","The sugar–phosphate backbone of a nucleic acid strand is held together by",
 ["phosphodiester bonds linking the phosphate of one nucleotide to the sugar of the next","hydrogen bonds between bases","peptide bonds between amino acids","glycosidic bonds between glucose units"],0,
 "Phosphodiester bonds are covalent and run along the backbone. Hydrogen bonds between bases hold two strands together.");
add("nucleic","The two strands of DNA are connected by hydrogen bonds between bases, not by covalent bonds. How is this useful to a cell?",
 ["The strands can be separated for replication and transcription without breaking the covalent backbones.","It makes DNA soluble in lipids.","It prevents DNA from ever being copied.","It allows the bases to form peptide bonds."],0,
 "Hydrogen bonds are individually weak, so enzymes can unzip the strands while the sugar–phosphate backbones stay intact.");
add("nucleic","Scientists measured the temperature at which three DNA samples separate into single strands. Which explanation best accounts for the pattern?",
 ["G–C pairs have three hydrogen bonds and A–T pairs have two, so GC-rich DNA needs more heat to separate.","A–T pairs have more hydrogen bonds, so AT-rich DNA melts at higher temperatures.","GC-rich DNA has fewer phosphodiester bonds.","Melting temperature depends only on the length of the sample."],0,
 "More hydrogen bonds per base pair means more energy is required to separate the strands.",
 {cap:"Melting temperature of DNA samples of equal length",head:["Sample","GC content (%)","Melting temp. (°C)"],rows:[["X","30","78"],["Y","50","87"],["Z","70","96"]]});
add("nucleic","ATP is classified as a nucleotide because it contains",
 ["adenine, the sugar ribose, and three phosphate groups","adenine, deoxyribose, and one phosphate group","an amino acid joined to three phosphates","glycerol, adenine, and two fatty acids"],0,
 "ATP is adenosine (adenine + ribose) with three phosphates. It is the main energy carrier of the cell.");
add("nucleic","NAD<sup>+</sup> and FAD are nucleotide-based molecules that function in cells mainly to",
 ["accept electrons (and H<sup>+</sup>) and carry them to other reactions","store genetic information","form the plasma membrane","digest proteins"],0,
 "NAD<sup>+</sup> and FAD are reduced to NADH and FADH<sub>2</sub> when they pick up electrons and carry them to other reactions.");
add("nucleic","Which TWO statements describe differences between DNA and RNA?",
 ["DNA contains deoxyribose, while RNA contains ribose.","RNA is usually single-stranded, while DNA is usually double-stranded.","RNA contains thymine, while DNA contains uracil.","DNA is a polymer of amino acids, while RNA is a polymer of nucleotides."],[0,1],
 "The sugar differs, and DNA is typically a double helix. RNA has uracil in place of thymine, and both are nucleotide polymers.");
add("nucleic","A mutation changes one nucleotide in the DNA sequence of a gene. Which statement best explains how this could change an organism's phenotype?",
 ["The change can alter the amino acid sequence of a protein, which can change its shape and function.","The change always converts the DNA into RNA.","The change moves the gene into a lipid membrane.","The change removes all phosphodiester bonds in the chromosome."],0,

/* Enzymes */
add("enzymes","Enzymes increase the rate of a chemical reaction by",
 ["lowering the activation energy of the reaction","increasing the free-energy difference between reactants and products","supplying ATP to the reactants","being used up as a reactant"],0,
 "Catalysts lower the energy barrier. They do not change the overall energy difference between reactants and products and are not consumed.");
add("enzymes","An enzyme catalyzes the breakdown of sucrose but not lactose. Which feature best explains this specificity?",
 ["The shape and chemistry of its active site fit sucrose but not lactose.","Lactose is too large to be broken down by any enzyme.","The enzyme is consumed when it binds lactose.","The enzyme's primary structure contains no R groups."],0,
 "The active site has a specific 3-D shape and arrangement of R groups. Only substrates that fit can bind.");
add("enzymes","After catalyzing a reaction, an enzyme molecule is typically",
 ["unchanged and able to catalyze more reactions","permanently altered into the product","broken down into amino acids","converted into a new substrate"],0,
 "Enzymes are not consumed. They are released after the products form and can be reused.");
add("enzymes","Based on the data, which statement best interprets the effect of temperature on this enzyme?",
 ["The optimum is near 40 °C, and activity drops at higher temperatures because the enzyme begins to denature.","Rate rises without limit because temperature always lowers activation energy.","The enzyme is most active at 10 °C because it is the least denatured there.","At 60 °C the rate is highest because molecules have the most kinetic energy."],0,
 "Rates rise with temperature as molecules collide more often, then fall sharply once heat unfolds the enzyme and the active site no longer works.",
 {cap:"Rate of an enzyme-catalyzed reaction",head:["Temperature (°C)","Rate (µmol product/min)"],rows:[["10","2"],["20","5"],["30","9"],["40","14"],["50","6"],["60","0"]]});
add("enzymes","Pepsin works best near pH 2 in the stomach. If pepsin enters the small intestine, where the pH is close to 8, its activity will most likely",
 ["drop sharply because the pH change alters R-group charges and interactions, changing the shape of the active site","rise because a higher pH always speeds up reactions","stay the same because enzymes function at any pH","rise because trypsin passes its active site to pepsin"],0,
 "Each enzyme has an optimum pH. Moving far from it changes the ionization of R groups, disrupts folding, and can denature the enzyme.");
add("enzymes","A molecule that resembles the substrate binds to the active site of an enzyme and blocks it. Which statement describes the effect of greatly increasing substrate concentration?",
 ["The inhibition can be overcome because substrate outcompetes the inhibitor for the active site.","The inhibition becomes permanent because the substrate denatures the enzyme.","The inhibitor changes the enzyme's primary structure.","The rate decreases further because substrate is a second inhibitor."],0,
 "This is competitive inhibition. The substrate and inhibitor compete for the same site, so more substrate reduces the inhibitor's share of the binding.");
add("enzymes","An inhibitor binds to an enzyme at a site other than the active site and changes the enzyme's shape so the substrate no longer fits. Compared with a competitive inhibitor, what happens when substrate concentration is increased?",
 ["Adding more substrate does not fully restore the reaction rate.","Adding more substrate completely removes the inhibition.","The inhibitor is converted into substrate.","Adding substrate raises the activation energy."],0,
 "Binding at an allosteric site reduces the amount of working enzyme, so extra substrate cannot fully overcome it.");
add("enzymes","In some metabolic pathways the final product binds to and inhibits the first enzyme in the pathway. This feedback inhibition is beneficial because it",
 ["prevents the cell from wasting resources by overproducing the product","permanently destroys the first enzyme","increases the activation energy for all reactions in the cell","converts the product back into the original substrate only"],0,
 "When the product accumulates, it shuts down its own production. When it is used up, the enzyme becomes active again.");
add("enzymes","Many coenzymes are derived from vitamins. Which statement about coenzymes is correct?",
 ["They are nonprotein organic molecules that assist enzymes during catalysis.","They are amino acids that make up the active site.","They are enzymes that digest other enzymes.","They are inorganic ions that permanently bind the substrate."],0,
 "Cofactors help enzymes work. Coenzymes are organic cofactors (for example NAD<sup>+</sup>), while metal ions such as Mg<sup>2+</sup> are inorganic cofactors.");
add("enzymes","A student studies the effect of pH on catalase in liver, using hydrogen peroxide as the substrate. Which setup is the best negative control?",
 ["A tube with hydrogen peroxide and buffer plus boiled liver","A tube with liver and buffer but no hydrogen peroxide, at the optimum pH","A tube using three times as much liver at pH 7","A tube with hydrogen peroxide only, with the temperature raised to 80 °C"],0,
 "A control shows what happens without active enzyme. Boiled liver contains denatured catalase, so any bubbling would indicate the reaction occurs without enzymes. Only one variable differs.");
add("enzymes","Which TWO statements about enzyme-catalyzed reactions are correct?",
 ["Increasing substrate concentration can increase the rate until the enzymes are saturated.","Adding more enzyme changes the free-energy difference between reactants and products.","A temperature above the optimum can reduce the rate by denaturing the enzyme.","Enzymes are consumed as the reaction proceeds."],[0,2],
 "Rate rises with substrate until all active sites are occupied. Excess heat unfolds the protein. Enzymes do not change the free-energy difference and are not consumed.");
add("enzymes","When a substrate binds to an enzyme's active site, the enzyme often changes shape slightly to grip the substrate more tightly. This model of enzyme action is called",
 ["induced fit","feedback inhibition","denaturation","competitive inhibition"],0,
 "In the induced-fit model the active site adjusts around the substrate, which helps bring reactants into position.");

add("carbon","In ethene (C<sub>2</sub>H<sub>4</sub>), which statement correctly describes the bonding?",
 ["The two carbon atoms share two pairs of electrons in a double bond, and each carbon is also bonded to two hydrogens.","The two carbon atoms share one pair of electrons, and each carbon is bonded to three hydrogens.","Each carbon forms only three covalent bonds because one valence electron stays unshared.","The two carbon atoms are held together by an ionic bond."],0,

add("carbon","Butane and isobutane both have the molecular formula C<sub>4</sub>H<sub>10</sub>. Butane is an unbranched chain and isobutane is a branched chain. These two molecules are",

add("carbon","Phosphate groups (–PO<sub>4</sub>) are a key functional group in",
 ["nucleic acids, ATP, and phospholipids","only hydrocarbons","the R groups of nonpolar amino acids","cellulose and starch"],0,

add("carbon","Which TWO statements about the hydroxyl group (–OH) are correct?",
 ["It is polar and can form hydrogen bonds with water.","It consists of an oxygen atom bonded to a hydrogen atom.","It is nonpolar and hydrophobic.","It consists of a carbon atom double-bonded to an oxygen atom."],[0,1],

add("carbon","In a skeletal drawing of an organic molecule, a zigzag line has no atom labels. What does each bend and each end of the line represent?",
 ["A carbon atom, with enough hydrogens assumed to give it four bonds","An oxygen atom","A double bond","A water molecule"],0,

add("carbon","Octane (C<sub>8</sub>H<sub>18</sub>), a component of gasoline, does not dissolve in water. Which feature best explains this?",
 ["Its C–H bonds are nonpolar, so it cannot form hydrogen bonds with polar water molecules.","It contains many ionic bonds that water cannot break.","It contains many hydroxyl groups that repel water.","It has too many double bonds to fit between water molecules."],0,
 "Hydrocarbons have nonpolar C–H bonds and no polar groups to interact with water, so they are hydrophobic. Octane has no double bonds or hydroxyl groups.");

add("polymers","During digestion, proteins are broken into amino acids. Which statement best describes the chemistry?",

add("polymers","A linear, unbranched polymer contains 100 monomers. How many water molecules are consumed when it is completely hydrolyzed into individual monomers?",

add("polymers","Why do cells use enzymes for both dehydration synthesis and hydrolysis reactions?",

add("polymers","A reaction mixture is sampled over time. Which process is occurring, and what change in the mixture would also be expected?",

 {cap:"Reaction mixture over time",head:["Time (min)","Free monomers (µM)","Monomers in polymer (µM)"],rows:[["0","500","0"],["10","380","120"],["20","260","240"],["30","140","360"]]});
add("polymers","Which TWO of the following are catabolic reactions?",
 ["Hydrolysis of starch into maltose","Hydrolysis of a triglyceride into glycerol and fatty acids","Formation of a peptide bond between two amino acids","Synthesis of a DNA strand from nucleotides"],[0,1],

add("polymers","Cells build thousands of different proteins from only 20 kinds of amino acids mainly because",
 ["the order of the amino acids in a polypeptide can vary in countless ways","each protein uses a set of amino acids found in no other protein","the peptide bond is chemically different in every protein","R groups are removed from amino acids before they are linked"],0,

add("polymers","A disaccharide made of two glucose units (maltose) is completely hydrolyzed. Which statement is correct?",
 ["Two glucose molecules are produced and one water molecule is consumed.","One glucose molecule is produced and one water molecule is released.","Two glucose molecules are produced and one water molecule is released.","A polysaccharide is produced and one water molecule is consumed."],0,

/* Carbohydrates */
add("carbs","Glucose can supply energy to cells faster than starch can. The best explanation is that",
 ["glucose can be used directly, while starch must first be hydrolyzed into glucose","glucose contains more carbon atoms than starch","starch has no C–H bonds","glucose is a lipid and stores more energy per gram"],0,
 "Monosaccharides need no digestion, while polysaccharides must be hydrolyzed first. That extra step is why starch supplies glucose more gradually.");
add("carbs","Which statement correctly compares plant and bacterial cell walls?",
 ["Plant cell walls are made mainly of cellulose, while bacterial cell walls contain peptidoglycan.","Plant cell walls are made of peptidoglycan, while bacterial cell walls are made of cellulose.","Both are made mainly of chitin.","Both are made mainly of phospholipids."],0,
 "Cellulose is a polysaccharide of β-glucose in plants. Peptidoglycan is a modified polysaccharide found in bacterial walls. Chitin is used by fungi and arthropods.");
add("carbs","A student mixes substrates and enzymes and tests each tube with Benedict's reagent after 30 minutes. Which conclusion is best supported by the results?",
 ["Each enzyme acts only on its own substrate: amylase on starch and cellulase on cellulose.","Cellulose cannot be broken down by any enzyme.","Starch is broken down into glucose without any enzyme.","Benedict's reagent detects starch."],0,

 {cap:"Benedict's reagent turns from blue to orange or brick red when glucose is present",head:["Tube","Substrate","Enzyme","Result"],rows:[["1","Starch","Amylase","Brick red"],["2","Cellulose","Amylase","Blue"],["3","Cellulose","Cellulase","Orange"],["4","Starch","None","Blue"]]});
add("carbs","Lactose, the sugar in milk, is a disaccharide composed of",
 ["glucose and galactose","glucose and fructose","two glucose molecules","galactose and fructose"],0,
 "Lactose = glucose + galactose. Sucrose = glucose + fructose. Maltose = glucose + glucose.");
add("carbs","Which TWO polysaccharides have mainly structural roles?",
 ["Cellulose","Glycogen","Chitin","Starch"],[0,2],
 "Cellulose supports plant cell walls and chitin supports fungal walls and arthropod exoskeletons. Glycogen and starch store glucose.");
add("carbs","Glycogen is highly branched. How does branching help the body mobilize energy?",
 ["Many chain ends are available, so enzymes can release glucose from many points at once.","Branching makes glycogen insoluble in all conditions.","Branching converts glucose into fructose.","Branching removes the need for enzymes."],0,

add("carbs","Which feature of cellulose contributes most to the strength of plant cell walls?",
 ["Parallel cellulose chains form hydrogen bonds with one another and bundle into microfibrils.","Cellulose chains are heavily branched like glycogen.","Cellulose chains are cross-linked by peptide bonds.","Cellulose contains α-glycosidic linkages that coil the chain."],0,

/* Lipids */
add("lipids","A phospholipid is described as amphipathic. This means that",
 ["it has a hydrophilic phosphate-containing head and hydrophobic fatty acid tails","it is made only of carbon and hydrogen","it is soluble in water throughout the molecule","it contains three fatty acids and no phosphate"],0,
 "Amphipathic molecules have both polar and nonpolar regions, which is what allows phospholipids to form bilayers.");
add("lipids","The waxy coating on many plant leaves helps reduce water loss. This function is best explained by waxes being",

add("enzymes","A student tests how temperature affects the activity of an enzyme using four water baths. Which variables should be kept constant?",

const FRQ=[

<script>
/* ---------- APP ---------- */
const $app=document.getElementById("app");
const L="ABCD";
const S={view:"home",quiz:null};
const BASE=BANK.filter(q=>!q.ai).length;
let sampleFn=null,aiGone=false,genCtl=null,genBusy=false;
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const cleanHTML=s=>esc(s).replace(/&lt;(\/?)(sub|sup)&gt;/g,"<$1$2>");
const plain=h=>{const d=document.createElement("div");d.innerHTML=h;return d.textContent};
const aiOn=()=>!!sampleFn&&!aiGone;
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
let missed=new Set(store.get("bd-missed",[]));
let best=store.get("bd-best",{});
let tally=store.get("bd-tally",{a:0,c:0});
let resetArmed=false,resetTimer=null;

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const topicOf=id=>TOPICS.find(t=>t.id===id);
const idsOf=t=>BANK.filter(q=>q.topic===t&&!q.ai).map(q=>q.id);
const ansList=q=>q.multi?q.ans:[q.ans];

function stats(){
  const acc=tally.a?Math.round(100*tally.c/tally.a)+"%":"–";
  document.getElementById("stats").innerHTML=`<span>Answered <b>${tally.a}</b></span><span>Accuracy <b>${acc}</b></span><span>To review <b>${missed.size}</b></span>`;
}
function save(){store.set("bd-missed",[...missed]);store.set("bd-best",best);store.set("bd-tally",tally)}
function bestText(key){const b=best[key];return b?`Best ${b.c}/${b.t}`:"Not attempted"}

/* ----- Home ----- */
function home(){
  S.view="home";S.quiz=null;stats();
  $app.innerHTML=`
  <div class="sec" style="gap:28px">
    <p class="lead"><strong>${BASE} multiple-choice questions</strong> and <strong>${FRQ.length} free-response prompts</strong> covering carbon chemistry, macromolecules, and enzymes. Pick a topic, take a mixed exam, or drill what you missed.${aiOn()?" Claude can also tutor you on any question and write new ones.":""}</p>
    <div class="row">
      <button class="btn primary" data-act="exam">Mixed exam · 20 questions</button>
      <button class="btn" data-act="missed" ${missed.size?"":"disabled"}>Review missed${missed.size?` (${missed.size})`:""}</button>
    </div>
    <section class="sec" aria-labelledby="h-t">
      <div class="sec-h"><h2 id="h-t">Practice by topic</h2><span>Instant feedback after every question</span></div>
      <div class="grid">${TOPICS.map(t=>{const n=idsOf(t.id).length;return `
        <button class="topic" data-act="topic" data-id="${t.id}" style="--tc:var(--c-${t.id})">
          <span class="motif">${t.motif}</span>
          <h3>${t.name}</h3>
          <span class="meta">${n} questions · ${bestText(t.id)}</span>
        </button>`}).join("")}</div>
    </section>
    ${genHTML()}
    <section class="sec" aria-labelledby="h-f">
      <div class="sec-h"><h2 id="h-f">Free response</h2><span>Write your answer, then score yourself with the guide</span></div>
      <div class="frqlist">${FRQ.map(f=>`
        <button class="frqcard" data-act="frq" data-id="${f.id}" style="--tc:var(--c-${f.topic})">
          <strong>${f.title}</strong>
          <span>${f.parts.length} parts · ${f.parts.length} points</span>
        </button>`).join("")}</div>
    </section>
  </div>`;
}

/* ----- Quiz ----- */
function start(title,ids,key){
  S.view="quiz";
  S.quiz={title,key,i:0,items:shuffle(ids).map(id=>({id,perm:shuffle(BANK[id].opts.map((_,i)=>i)),picked:[],checked:false,correct:false,chat:[],busy:false,live:"",err:"",ctl:null}))};
  renderQuiz();
}
function renderQuiz(){
  const z=S.quiz,it=z.items[z.i],q=BANK[it.id],t=topicOf(q.topic);
  const need=q.multi?2:1;
  const pct=Math.round(100*z.i/z.items.length);
  const opts=it.perm.map((orig,p)=>{
    const sel=it.picked.includes(p),isAns=ansList(q).includes(orig);
    let cls="opt",tag="";
    if(it.checked){
      if(isAns){cls+=" good";tag=sel?"Your answer · correct":"Correct answer"}
      else if(sel){cls+=" bad";tag="Your answer"}
    }
    return `<button class="${cls}" data-act="pick" data-p="${p}" aria-pressed="${sel}" ${it.checked?"disabled":""}><span class="ltr">${L[p]}</span><span class="otxt">${q.opts[orig]}${tag?`<span class="tag">${tag}</span>`:""}</span></button>`;
  }).join("");
  const tbl=q.table?`<div class="tblwrap"><table><caption>${q.table.cap}</caption><thead><tr>${q.table.head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${q.table.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`:"";
  const last=z.i===z.items.length-1;
  $app.innerHTML=`
  <div class="sec" style="gap:18px;--tc:var(--c-${q.topic})">
    <div class="qhead"><span class="chip">${t.name}${q.ai?'<span class="aibadge">AI-generated</span>':''}</span><span class="count">${z.title} · ${z.i+1} / ${z.items.length}</span></div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${z.items.length}" aria-valuenow="${z.i}"><i style="width:${pct}%"></i></div>
    <p class="stem">${q.q}</p>
    ${tbl}
    ${q.multi?`<p class="instr">Select two answers</p>`:""}
    <div class="opts" role="group" aria-label="Answer choices">${opts}</div>
    ${it.checked?`
      <div class="fb ${it.correct?"good":"bad"}" role="status"><strong>${it.correct?"Correct":"Not quite"}</strong><p>${q.exp}</p></div>
      <div class="row"><button class="btn primary" id="next" data-act="next">${last?"See results":"Next question"}</button></div>`
    :`
      <div class="row"><button class="btn primary" id="check" data-act="check" ${it.picked.length===need?"":"disabled"}>Check answer</button>
      <span class="kbd">Keys: A–D to choose, Enter to check</span></div>`}
    <div id="ai"></div>
    <div><button class="link" data-act="home">Quit to home</button></div>
  </div>`;
  renderAI();
  if(it.checked){const n=document.getElementById("next");if(n)n.focus({preventScroll:false})}
}
function pick(p){
  const z=S.quiz,it=z.items[z.i],q=BANK[it.id];
  if(it.checked)return;
  if(q.multi){
    if(it.picked.includes(p))it.picked=it.picked.filter(x=>x!==p);
    else{it.picked.push(p);if(it.picked.length>2)it.picked.shift()}
  }else it.picked=[p];
  document.querySelectorAll(".opt").forEach(b=>b.setAttribute("aria-pressed",String(it.picked.includes(+b.dataset.p))));
  const c=document.getElementById("check");if(c)c.disabled=it.picked.length!==(q.multi?2:1);
}
function check(){
  const z=S.quiz,it=z.items[z.i],q=BANK[it.id];
  if(it.checked)return;
  const need=q.multi?2:1;
  if(it.picked.length!==need)return;
  const sel=it.picked.map(p=>it.perm[p]).sort((a,b)=>a-b);
  const ans=ansList(q).slice().sort((a,b)=>a-b);
  it.correct=sel.length===ans.length&&sel.every((v,i)=>v===ans[i]);
  it.checked=true;
  if(!q.ai){tally.a++;if(it.correct){tally.c++;missed.delete(q.id)}else missed.add(q.id);save();stats()}
  renderQuiz();
}
function next(){
  const z=S.quiz;
  if(z.i<z.items.length-1){z.i++;renderQuiz();window.scrollTo(0,0)}
  else finish();
}
function finish(){
  const z=S.quiz,n=z.items.length,c=z.items.filter(i=>i.correct).length;
  if(z.key){const b=best[z.key];if(!b||c/n>b.c/b.t){best[z.key]={c,t:n};save()}}
  S.view="results";renderResults();window.scrollTo(0,0);
}
function renderResults(){
  const z=S.quiz,n=z.items.length,c=z.items.filter(i=>i.correct).length;
  const by={};
  z.items.forEach(i=>{const t=BANK[i.id].topic;(by[t]=by[t]||{c:0,t:0});by[t].t++;if(i.correct)by[t].c++});
  const rows=TOPICS.filter(t=>by[t.id]).map(t=>{const b=by[t.id];return `<div class="tb" style="--tc:var(--c-${t.id})"><span>${t.name}</span><div class="bar"><i style="width:${100*b.c/b.t}%"></i></div><em>${b.c}/${b.t}</em></div>`}).join("");
  const wrong=z.items.filter(i=>!i.correct);
  const wrongHtml=wrong.map(i=>{const q=BANK[i.id];return `<article class="miss"><p class="count">${topicOf(q.topic).name}</p><p class="stem">${q.q}</p><p class="ca">Correct: ${ansList(q).map(o=>q.opts[o]).join(" · ")}</p><p>${q.exp}</p></article>`}).join("");
  $app.innerHTML=`
  <div class="sec" style="gap:24px">
    <div class="sec"><h2>${z.title} results</h2>
      <div class="score"><b>${c}/${n}</b><span>${Math.round(100*c/n)}% correct</span></div></div>
    <section class="sec"><h2>By topic</h2>${rows}</section>
    <div class="row">
      ${wrong.length?`<button class="btn primary" data-act="retry">Practice the ${wrong.length} I missed</button>`:""}
      ${z.gen&&aiOn()?`<button class="btn" data-act="gen" data-gen data-label="Generate 5 more" data-topic="${z.gen}">Generate 5 more</button><span class="kbd" id="genStatus" role="status"></span>`:""}
      <button class="btn" data-act="home">Back to home</button>
    </div>
    ${wrong.length?`<section class="sec"><h2>Questions to review</h2>${wrongHtml}</section>`:`<p class="lead">No misses in this set.</p>`}
  </div>`;
}

/* ----- Free response ----- */
function frq(id){
  const f=FRQ.find(x=>x.id===id);
  S.view="frq";stats();
  const parts=f.parts.map((p,i)=>`
    <div class="part"><p><b>(${L[i].toLowerCase()})</b> ${p.t}<span class="pts">1 pt</span></p>
    <textarea id="${f.id}-${i}" aria-label="Your answer for part ${L[i].toLowerCase()}" placeholder="Type your answer here"></textarea></div>`).join("");
  const rub=f.parts.map((p,i)=>`
    <div class="rub"><input type="checkbox" id="${f.id}-r${i}"><label for="${f.id}-r${i}"><b>(${L[i].toLowerCase()})</b> I earned this point<small>Needs: ${p.r}</small></label></div>`).join("");
  const model=f.parts.map((p,i)=>`<b>(${L[i].toLowerCase()})</b> ${p.m}`).join("<br>");
  $app.innerHTML=`
  <div class="sec" style="gap:18px;--tc:var(--c-${f.topic})" data-frq="${f.id}">
    <div class="qhead"><span class="chip">${topicOf(f.topic).name}</span><span class="count">Free response · ${f.parts.length} points</span></div>
    <h2>${f.title}</h2>
    <p class="stem">${f.intro}</p>
    ${parts}
    <div class="row"><button class="btn primary" data-act="guide" id="guideBtn" aria-controls="guide" aria-expanded="false">Show scoring guide</button><button class="btn" data-act="home">Back to home</button></div>
    <div class="guide" id="guide" hidden>
      <h2>Scoring guide</h2>
      ${rub}
      <div class="selfscore" id="selfscore" aria-live="polite">Self-score: 0 / ${f.parts.length}</div>
      <p class="model"><b>Sample response</b><br>${model}</p>
    </div>
  </div>`;
}

/* ----- Events ----- */
function act(a,b){
  if(genCtl&&["home","topic","exam","missed","frq","retry"].includes(a))genCtl.abort();
  switch(a){
    case "home":home();window.scrollTo(0,0);break;
    case "topic":{const t=topicOf(b.dataset.id);start(t.name,idsOf(t.id),t.id);window.scrollTo(0,0);break}
    case "exam":start("Mixed exam",shuffle(BANK.filter(q=>!q.ai).map(q=>q.id)).slice(0,20),"exam");window.scrollTo(0,0);break;
    case "missed":{const ids=[...missed].filter(id=>BANK[id]);if(ids.length){start("Review missed",ids,null);window.scrollTo(0,0)}break}
    case "retry":{const ids=S.quiz.items.filter(i=>!i.correct).map(i=>i.id);start("Practice missed",ids,null);window.scrollTo(0,0);break}
    case "gen":generate(b.dataset.topic||(document.getElementById("genTopic")||{}).value||"all");break;
    case "genstop":if(genCtl)genCtl.abort();break;
    case "chip":askAI(b.dataset.q);break;
    case "aistop":{const z=S.quiz;const it=z&&z.items[z.i];if(it&&it.ctl)it.ctl.abort();break}
    case "pick":pick(+b.dataset.p);break;
    case "check":check();break;
    case "next":next();break;
    case "frq":frq(b.dataset.id);window.scrollTo(0,0);break;
    case "guide":{const g=document.getElementById("guide");g.hidden=!g.hidden;b.textContent=g.hidden?"Show scoring guide":"Hide scoring guide";b.setAttribute("aria-expanded",String(!g.hidden));if(!g.hidden)g.scrollIntoView({behavior:"smooth",block:"start"});break}
    case "reset":{
      const r=document.getElementById("resetBtn");
      if(!resetArmed){resetArmed=true;r.textContent="Click again to clear all saved progress";clearTimeout(resetTimer);resetTimer=setTimeout(()=>{resetArmed=false;r.textContent="Clear saved progress"},4000)}
      else{clearTimeout(resetTimer);resetArmed=false;r.textContent="Clear saved progress";missed=new Set();best={};tally={a:0,c:0};["bd-missed","bd-best","bd-tally"].forEach(store.del);home()}
      break}
  }
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b||b.disabled)return;act(b.dataset.act,b)});
document.addEventListener("change",e=>{
  const w=e.target.closest("[data-frq]");if(!w||e.target.type!=="checkbox")return;
  const boxes=w.querySelectorAll(".rub input");
  document.getElementById("selfscore").textContent=`Self-score: ${[...boxes].filter(x=>x.checked).length} / ${boxes.length}`;
});
document.addEventListener("keydown",e=>{
  if(S.view!=="quiz"||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.target.closest&&e.target.closest("input,textarea,select"))return;
  const z=S.quiz,it=z.items[z.i];
  const k=e.key.toLowerCase(),idx="abcd".indexOf(k),num="1234".indexOf(k);
  const p=idx>=0?idx:num;
  if(p>=0&&p<it.perm.length&&!it.checked){pick(p);return}
  if(e.key==="Enter"&&!(e.target.closest&&e.target.closest("button"))){
    if(it.checked)next();else check();
  }
});

/* ----- AI tutor (Claude via the sample capability) ----- */
const AI_ERR={
  rate_limited:"Too many requests, or you have reached your Claude usage limit. Try again in a little while.",
  session_expired:"Sign in to Claude again to keep using the tutor.",
  refused:"Claude could not respond to that. Try rephrasing your question.",
  prompt_too_large:"That conversation got too long. Move on to the next question.",
  upstream_error:"Could not reach Claude just now. Try again."
};
const AI_GONE=["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"];

function aiContext(it){
  const q=BANK[it.id];
  const opts=it.perm.map((o,p)=>`${L[p]}. ${plain(q.opts[o])}`).join("\n");
  const key=ansList(q).map(o=>L[it.perm.indexOf(o)]).sort().join(" and ");
  const picked=it.picked.map(p=>L[p]).sort().join(" and ")||"nothing";
  const tbl=q.table?"\nData table ("+q.table.cap+"):\n"+[q.table.head.join(" | "),...q.table.rows.map(r=>r.join(" | "))].join("\n"):"";
  const state=it.checked
    ?`The student has checked their answer and it was ${it.correct?"correct":"incorrect"}. Their choice: ${picked}. The correct answer: ${key}. Official explanation: ${plain(q.exp)}`
    :`The student has NOT answered yet and currently has ${picked} selected. Never state, confirm, or hint at which option letter is correct, and do not reveal the answer outright. Give a hint that points toward the underlying concept and nudges their reasoning.`;
  return `You are a friendly, precise AP Biology tutor helping a high-school student practice Unit 1 (chemistry of life: carbon, macromolecules, enzymes).
Question: ${plain(q.q)}${q.multi?" (Select two answers.)":""}${tbl}
Options:
${opts}
${state}
${q.ai?"This question was written by an AI, so its answer key could be wrong. If the key looks wrong to you, say so plainly.":"The answer key above is authoritative."}
Rules: Reply in at most 140 words. Plain text only, with no markdown symbols (no asterisks, pound signs, or bullet characters), in short paragraphs; write formulas like C6H12O6. Stay on this question and AP Biology, and steer back politely if asked about something unrelated. Be accurate to the AP Biology course and say so if you are unsure. The student's conversation with you follows.`;
}
function paintLive(it){
  if(S.quiz&&S.quiz.items[S.quiz.i]===it){const el=document.getElementById("live");if(el)el.textContent=it.live}
}
function renderAI(){
  const host=document.getElementById("ai");
  if(!host||S.view!=="quiz"||!S.quiz)return;
  if(!aiOn()){host.innerHTML="";return}
  const it=S.quiz.items[S.quiz.i];
  const chips=it.checked
    ?[["Explain it simply","Explain why the correct answer is right, in simple terms."],["Why are the others wrong?","Briefly explain why each of the other options is wrong."],["Memory trick","Give me a memory trick or analogy for this concept."],["Quiz me on it","Ask me one quick follow-up question on this concept, then wait for my reply."]]
    :[["Give me a hint","Give me a hint without giving away the answer."],["What concept is this?","Which concept is this question testing? Do not give away the answer."]];
  const bubbles=it.chat.map(m=>`<div class="bub ${m.role==="user"?"me":""}"><small>${m.role==="user"?"You":"Claude"}</small><p>${esc(m.content)}</p></div>`).join("")
    +(it.busy?`<div class="bub"><small>Claude</small><p id="live">${it.live?esc(it.live):"Thinking…"}</p></div>`:"");
  host.innerHTML=`<section class="ai" aria-label="Claude tutor">
    <div class="ai-h"><strong>Ask Claude</strong><span>AI tutor. It can make mistakes, so check against your notes.</span></div>
    <div class="chips">${chips.map(c=>`<button class="chipbtn" data-act="chip" data-q="${esc(c[1])}" ${it.busy?"disabled":""}>${c[0]}</button>`).join("")}</div>
    ${bubbles?`<div class="thread">${bubbles}</div>`:""}
    ${it.err?`<p class="aierr" role="alert">${it.err}</p>`:""}
    <form class="aiform" id="aiForm" autocomplete="off">
      <input id="aiInput" type="text" maxlength="400" placeholder="${it.checked?"Ask a follow-up question":"Ask about this concept"}" aria-label="Ask Claude about this question" ${it.busy?"disabled":""}>
      ${it.busy?`<button type="button" class="btn" data-act="aistop">Stop</button>`:`<button type="submit" class="btn">Send</button>`}
    </form>
  </section>`;
}
async function askAI(text){
  text=(text||"").trim();
  if(!text||!aiOn()||!S.quiz)return;
  const it=S.quiz.items[S.quiz.i];
  if(it.busy)return;
  it.chat.push({role:"user",content:text});
  it.busy=true;it.live="";it.err="";it.ctl=new AbortController();
  renderAI();
  try{
    const r=await sampleFn([{role:"user",content:aiContext(it)},...it.chat],{
      cache:false,signal:it.ctl.signal,
      onText:({text:t})=>{it.live=t;paintLive(it)}
    });
    it.chat.push({role:"assistant",content:r.text});
  }catch(e){
    if(e&&e.text)it.chat.push({role:"assistant",content:e.text});
    if(!e||e.code!=="cancelled"){
      if(e&&AI_GONE.includes(e.code))aiGone=true;
      it.err=AI_ERR[e&&e.code]||"Could not get an answer. Try again.";
    }
  }finally{
    it.busy=false;it.live="";it.ctl=null;
  }
  if(S.quiz&&S.quiz.items[S.quiz.i]===it&&S.view==="quiz"){
    renderAI();
    const inp=document.getElementById("aiInput");if(inp&&!aiGone)inp.focus({preventScroll:true});
  }
}

/* ----- AI-written practice questions ----- */
function genHTML(){
  if(!aiOn())return "";
  return `<section class="gen" aria-labelledby="h-a">
    <div class="sec-h"><h2 id="h-a">AI practice</h2><span>Claude writes new questions each time</span></div>
    <p class="lead">Generate five fresh AP-style questions on any topic. Each one comes with the tutor for hints and explanations. Questions written by Claude can contain mistakes.</p>
    <div class="row">
      <label for="genTopic" class="kbd">Topic</label>
      <select id="genTopic"><option value="all">All topics</option>${TOPICS.map(t=>`<option value="${t.id}">${t.name}</option>`).join("")}</select>
      <button class="btn primary" data-act="gen" data-gen data-label="Generate 5 questions">Generate 5 questions</button>
    </div>
    <p class="kbd" id="genStatus" role="status"></p>
  </section>`;
}
function setGen(busy,msg){
  document.querySelectorAll("[data-gen]").forEach(b=>{b.dataset.act=busy?"genstop":"gen";b.textContent=busy?"Stop":(b.dataset.label||"Generate 5 questions")});
  const s=document.getElementById("genStatus");if(s)s.textContent=msg||"";
}
function toQuestion(x,scope){
  try{
    if(!x||typeof x.q!=="string"||typeof x.exp!=="string")return null;
    if(!Array.isArray(x.opts)||x.opts.length!==4||!x.opts.every(o=>typeof o==="string"&&o.trim()))return null;
    if(new Set(x.opts.map(o=>o.trim())).size!==4)return null;
    let ans=x.ans;
    if(Array.isArray(ans)){
      ans=[...new Set(ans)].filter(n=>Number.isInteger(n)&&n>=0&&n<4).sort((a,b)=>a-b);
      if(ans.length!==2)return null;
    }else if(!(Number.isInteger(ans)&&ans>=0&&ans<4))return null;
    const topic=scope.some(t=>t.id===x.topic)?x.topic:scope[0].id;
    return {id:-1,topic,q:cleanHTML(x.q.trim()),opts:x.opts.map(o=>cleanHTML(o.trim())),ans,exp:cleanHTML(x.exp.trim()),table:null,multi:Array.isArray(ans),ai:true};
  }catch(e){return null}
}
async function generate(topic){
  if(!aiOn()||genBusy)return;
  const scope=topic==="all"?TOPICS:[topicOf(topic)||TOPICS[0]];
  genBusy=true;genCtl=new AbortController();
  setGen(true,"Claude is writing questions. This can take up to a minute.");
  const list=scope.map(t=>`${t.id} = ${t.name}`).join("; ");
  const prompt=`You write original multiple-choice questions for a high-school AP Biology student reviewing Unit 1 (chemistry of life).
Topics: ${list}.
Write exactly 5 questions${scope.length>1?", spread across different topics":", all on this topic"}. Vary the style: some direct concept checks, some real-world scenarios, at least one that describes an experiment or a small data set in words, and at most one "select two" question (end its stem with "Select TWO.").
Requirements:
- Be accurate to the College Board AP Biology course. Before you answer, verify every answer key and make sure exactly one option is correct (exactly two for a select-two question).
- Each question has exactly 4 options. Wrong options must be plausible misconceptions, not jokes. Vary which option is correct.
- Test understanding rather than recall of exact wording.
- Plain text only. For chemical formulas and charges use only <sub> and <sup> tags, like C<sub>6</sub>H<sub>12</sub>O<sub>6</sub>. No other HTML and no markdown.
Reply with only a JSON array of 5 objects shaped like: {"topic":"enzymes","q":"question text","opts":["option text","option text","option text","option text"],"ans":2,"exp":"One to three sentences on why the key is right."}. For a select-two question use "ans":[0,3].`;
  try{
    const raw=await sampleFn.json(prompt,{signal:genCtl.signal,cache:false});
    const made=(Array.isArray(raw)?raw:[]).map(x=>toQuestion(x,scope)).filter(Boolean).slice(0,5);
    if(made.length<3){genBusy=false;genCtl=null;setGen(false,"Claude's reply was not usable. Try again.");return}
    const ids=made.map(m=>{m.id=BANK.length;BANK.push(m);return m.id});
    genBusy=false;genCtl=null;
    start("AI practice",ids,null);
    S.quiz.gen=topic;
    window.scrollTo(0,0);
  }catch(e){
    genBusy=false;genCtl=null;
    const code=e&&e.code;
    if(code==="cancelled"){setGen(false,"");return}
    if(AI_GONE.includes(code)){aiGone=true;if(S.view==="home")home();return}
    setGen(false,code==="invalid_json"?"Claude's reply was not valid. Try again.":(AI_ERR[code]||"Could not get questions. Try again."));
  }
}

document.addEventListener("submit",e=>{
  if(e.target.id!=="aiForm")return;
  e.preventDefault();
  const i=document.getElementById("aiInput");
  const v=i.value;i.value="";
  askAI(v);
});

(async()=>{
  try{const c=window.claude;if(c&&typeof c.use==="function")sampleFn=await c.use("sample")}catch(e){sampleFn=null}
  if(aiOn()){if(S.view==="home")home();else if(S.view==="quiz")renderAI()}
})();

home();
</script>

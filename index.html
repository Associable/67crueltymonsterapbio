<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Chap. 4 &amp; 5 Vocab Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Public+Sans:wght@400;500;700;800&display=swap">
<style>
/* Layout: one printed worksheet on a desk. Word bank on top (3 columns), then 40 numbered questions with a blank at the left, as on the paper. */
:root {
  --desk: #d3dccd;
  --paper: #eef6e3;
  --ink: #1d2a1e;
  --muted: #566656;
  --rule: #9db08f;
  --pen: #1e44c8;
  --good: #17703a;
  --bad: #c0281f;
  --accent: #2c6a3d;
  --accent-ink: #f3fbe9;
  --body: "Public Sans", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --hand: "Caveat", "Segoe Print", "Bradley Hand", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #11160f;
    --paper: #1b231a;
    --ink: #e5eddb;
    --muted: #a4b59f;
    --rule: #3f503b;
    --pen: #8fb2ff;
    --good: #66d28f;
    --bad: #ff8f84;
    --accent: #86c996;
    --accent-ink: #10190f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #11160f;
  --paper: #1b231a;
  --ink: #e5eddb;
  --muted: #a4b59f;
  --rule: #3f503b;
  --pen: #8fb2ff;
  --good: #66d28f;
  --bad: #ff8f84;
  --accent: #86c996;
  --accent-ink: #10190f;
  color-scheme: dark;
}

body {
  background: var(--desk);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.45;
  padding-inline: 16px;
  padding-block: 16px 40px;
}
.wrap { max-width: 54rem; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }

/* toolbar */
.bar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  display: flex;
  flex-wrap: wrap;
  gap: 8px 12px;
  align-items: center;
  justify-content: space-between;
  background: var(--paper);
  border: 1px solid var(--rule);
  padding: 8px 10px;
}
.seg { display: inline-flex; border: 1px solid var(--accent); }
.seg button, .act button {
  font: 700 0.85rem/1 var(--body);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 10px 14px;
  min-height: 40px;
  border: 0;
  cursor: pointer;
  background: transparent;
  color: var(--accent);
}
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.act { display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.act button { border: 1px solid var(--accent); }
.act button.primary { background: var(--accent); color: var(--accent-ink); }
.count { font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--pen); outline-offset: 2px; }

/* the sheet */
.sheet {
  background: var(--paper);
  border: 1px solid var(--rule);
  box-shadow: 0 14px 30px -22px rgba(0, 0, 0, 0.55);
  padding: 20px clamp(14px, 4vw, 36px) 28px;
}
.head {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 12px;
  border-bottom: 2px solid var(--ink);
  padding-bottom: 10px;
}
.head h1 { margin: 0; font-size: 1.35rem; font-weight: 800; line-height: 1.15; text-wrap: balance; }
.head p { margin: 2px 0 0; color: var(--muted); font-size: 0.9rem; }
.score { font: 700 2.2rem/1 var(--hand); color: var(--bad); white-space: nowrap; font-variant-numeric: tabular-nums; }

/* answer bank */
details.bank { margin-top: 14px; }
details.bank summary {
  cursor: pointer;
  font-size: 0.78rem;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  padding-block: 4px;
}
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 4px 24px; margin-top: 8px; }
.cols ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; min-width: 0; }
.chip {
  display: block;
  width: 100%;
  text-align: left;
  font: 400 0.9rem/1.3 var(--body);
  color: var(--ink);
  background: transparent;
  border: 0;
  padding: 4px 4px;
  min-height: 28px;
  cursor: pointer;
}
.chip b { display: inline-block; min-width: 2.2rem; font-weight: 700; }
.chip:disabled { color: var(--ink); cursor: default; opacity: 1; }
[data-mode="quiz"] .chip:hover { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.chip.used span { text-decoration: line-through; text-decoration-color: var(--pen); text-decoration-thickness: 2px; color: var(--muted); }

/* questions */
.qs { margin-top: 12px; border-top: 1px solid var(--rule); }
.q {
  display: grid;
  grid-template-columns: 4.4rem minmax(0, 1fr);
  gap: 4px 14px;
  align-items: end;
  padding-block: 9px;
  border-bottom: 1px dotted var(--rule);
}
.blank {
  width: 100%;
  min-width: 0;
  border: 0;
  border-bottom: 2px solid var(--ink);
  border-radius: 0;
  background: transparent;
  color: var(--pen);
  font: 700 1.75rem/1 var(--hand);
  text-align: center;
  text-transform: uppercase;
  padding: 0 0 2px;
}
.blank[readonly] { cursor: default; }
.txt { margin: 0; max-width: 65ch; font-size: 0.97rem; }
.txt b { font-weight: 800; margin-right: 0.3em; font-variant-numeric: tabular-nums; }
.term { grid-column: 2; margin: 0; font-size: 0.85rem; color: var(--muted); }
.q.ok .blank { border-bottom-color: var(--good); color: var(--good); }
.q.ok .term { color: var(--good); }
.q.bad .blank { border-bottom-color: var(--bad); color: var(--bad); text-decoration: line-through; }
.q.bad .term { color: var(--bad); font-weight: 700; }

@media (max-width: 30rem) {
  .q { grid-template-columns: 3.6rem minmax(0, 1fr); gap: 4px 10px; }
  .head h1 { font-size: 1.15rem; }
  .score { font-size: 1.8rem; }
}
</style>

<div class="wrap" id="app" data-mode="study">
  <div class="bar" role="toolbar" aria-label="Study controls">
    <div class="seg" role="group" aria-label="Mode">
      <button type="button" id="m-study" aria-pressed="true">Study</button>
      <button type="button" id="m-quiz" aria-pressed="false">Quiz</button>
    </div>
    <div class="act">
      <span class="count" id="count" aria-live="polite"></span>
      <button type="button" class="primary" id="check" hidden>Check</button>
      <button type="button" id="clear" hidden>Clear</button>
    </div>
  </div>

  <main class="sheet">
    <header class="head">
      <div>
        <h1>Chap. 4 &amp; 5 Vocab Quiz</h1>
        <p>Mr. McKenzie/Mr. Schuelein</p>
      </div>
      <div class="score" id="score" aria-label="Score">&mdash;/40</div>
    </header>

    <details class="bank" open>
      <summary>Answer bank</summary>
      <div class="cols" id="bank"></div>
    </details>

    <div class="qs" id="qs"></div>
  </main>
</div>

<script>
(function () {
  var BANK = [
    ["A","Aldehyde Group"],["B","Amino Acid"],["C","Amino Group"],["D","Amylose"],["E","Carbonyl Group"],["F","Carboxyl Group"],
    ["G","Cellulose"],["H","Chitin"],["I","Cholesterol"],["J","Cis-Trans Isomer"],["K","Dehydration Synthesis"],["L","Disaccharide"],
    ["M","DNA"],["N","Enantiomer"],["O","Fatty Acid"],["P","Fructose"],["Q","Functional Group"],["R","Glucose"],
    ["S","Glycogen"],["T","Glycosidic Linkage"],["U","Hydrocarbon"],["V","Hydrolysis"],["W","Hydroxyl Group"],["X","Isomer"],
    ["Y","Ketone Group"],["Z","Lipid"],["AA","Macromolecule"],["BB","Methyl Group"],["CC","Monomer"],["DD","Monosaccharide"],
    ["EE","Nucleic Acid"],["FF","Nucleotide"],["GG","Oligosaccharide"],["HH","Organic Compound"],["II","Peptide"],["JJ","Peptide Bond"],
    ["KK","Phosphate Group"],["LL","Phospholipid"],["MM","Polymer"],["NN","Polypeptide"],["OO","Polysaccharide"],["PP","Purine"],
    ["QQ","Pyrimidine"],["RR","RNA"],["SS","Saturated Fatty Acid"],["TT","Starch"],["UU","Steroid"],["VV","Stereoisomer"],
    ["WW","Structural Isomer"],["XX","Sucrose"],["YY","Sulfhydryl Group"],["ZZ","Triacylglycerol (Triglyceride)"],["AAA","Unsaturated Fatty Acid"]
  ];
  var TERM = {};
  BANK.forEach(function (b) { TERM[b[0]] = b[1]; });

  var Q = [
    [1, "A class of large biological molecules.", "AA"],
    [2, "A large molecule built by linking many smaller molecules together.", "MM"],
    [3, "The monomer of a protein.", "B"],
    [4, "A functional group that contains a carbon atom double bonded to an oxygen atom and single bonded to a hydroxyl (COOH).", "F"],
    [5, "Molecules that possess the same molecular formulas and structure.", "VV"],
    [6, "A group or chain of carbon atoms that contain a carbonyl group on a middle carbon.", "Y"],
    [7, "A long chain of amino acids. It is another term for protein.", "NN"],
    [8, "The monomer of a nucleic acid.", "FF"],
    [9, "The disaccharide produced when a glucose molecule and a fructose molecule are combined.", "XX"],
    [10, "This polysaccharide is composed of beta linkages and is used by plants to make cell wall material.", "G"],
    [11, "Isomers that are mirror images of each other.", "N"],
    [12, "Only single bonds exist between the carbons in this chain. They are solids at room temperature.", "SS"],
    [13, "This nucleic acid contains the base uracil.", "RR"],
    [14, "This catabolic reaction occurs by adding water (causes molecules or compounds to break apart).", "V"],
    [15, "At least one double bond exists between the carbons in this chain. They are liquid at room temperature.", "AAA"],
    [16, "DNA and RNA are examples of this macromolecule.", "EE"],
    [17, "A functional group that is composed of a hydrogen atom and an oxygen atom (OH).", "W"],
    [18, "The type of bond that links amino acids together.", "JJ"],
    [19, "The type of bond that links monosaccharides together.", "T"],
    [20, "A polysaccharide that makes up the exoskeleton in arthropods, such as beetles and lobsters.", "H"],
    [21, "A functional group that contains a nitrogen and two hydrogens bonded to a carbon (NH₂).", "C"],
    [22, "A type of compound molecule containing polar “heads” and nonpolar “tails”.", "LL"],
    [23, "A type of starch that is found in muscle tissue.", "S"],
    [24, "A functional group that contains an oxygen double bonded to a carbon (C=O).", "E"],
    [25, "This category of nitrogenous bases are double ringed structures (Adenine and Guanine).", "PP"],
    [26, "This category of nitrogenous bases are single ringed structures (Cytosine, Thymine & Uracil).", "QQ"],
    [27, "This anabolic reaction forms a covalent bond between two monomers by removing water.", "K"],
    [28, "A structural isomer of glucose.", "P"],
    [29, "A compound that is made up of carbon and hydrogen. It may also contain oxygen and nitrogen.", "HH"],
    [30, "These compounds are insoluble in water and are made up of glycerol and fatty acids. This includes fats, oils, and waxes.", "Z"],
    [31, "The monomer of a carbohydrate.", "DD"],
    [32, "Molecules that possess the same molecular formulas but differ in their structure.", "WW"],
    [33, "A functional group that is composed of a carbon atom bonded to three hydrogen atoms (CH₃).", "BB"],
    [34, "A group or chain of carbon atoms that contain a carbonyl group on an end carbon.", "A"],
    [35, "A functional group that contains a sulfur atom bonded to a hydrogen atom (SH).", "YY"],
    [36, "When covalently bonded to amino acids, they will form glycoproteins.", "GG"],
    [37, "An alpha linked polysaccharide.", "D"],
    [38, "A molecule that is considered to be the starting material for the biosynthesis of other molecules of its kind.", "I"],
    [39, "A functional group that is composed of a phosphorus atom bonded to four oxygen atoms (PO₄).", "KK"],
    [40, "The most common monosaccharide with an empirical formula of C₆H₁₂O₆.", "R"]
  ];

  var KEY = "chap45-vocab-answers";
  var app = document.getElementById("app");
  var qsEl = document.getElementById("qs");
  var bankEl = document.getElementById("bank");
  var scoreEl = document.getElementById("score");
  var countEl = document.getElementById("count");
  var btnStudy = document.getElementById("m-study");
  var btnQuiz = document.getElementById("m-quiz");
  var btnCheck = document.getElementById("check");
  var btnClear = document.getElementById("clear");

  var mode = "study";
  var checked = false;
  var ans = {};
  var last = null;
  try { ans = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { ans = {}; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(ans)); } catch (e) {} }

  // word bank in three columns, split as on the paper (A-R, S-JJ, KK-AAA)
  var groups = [BANK.slice(0, 18), BANK.slice(18, 36), BANK.slice(36)];
  var chips = {};
  groups.forEach(function (g) {
    var ul = document.createElement("ul");
    g.forEach(function (b) {
      var li = document.createElement("li");
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "chip";
      btn.innerHTML = "<b>" + b[0] + ".</b><span>" + b[1] + "</span>";
      btn.addEventListener("mousedown", function (e) { e.preventDefault(); });
      btn.addEventListener("click", function () { pick(b[0]); });
      chips[b[0]] = btn;
      li.appendChild(btn);
      ul.appendChild(li);
    });
    bankEl.appendChild(ul);
  });

  // questions
  var rows = Q.map(function (q) {
    var row = document.createElement("div");
    row.className = "q";
    var input = document.createElement("input");
    input.type = "text";
    input.id = "a" + q[0];
    input.className = "blank";
    input.maxLength = 3;
    input.autocomplete = "off";
    input.autocapitalize = "characters";
    input.spellcheck = false;
    input.setAttribute("enterkeyhint", "next");
    input.setAttribute("aria-label", "Answer for question " + q[0]);
    var txt = document.createElement("p");
    txt.className = "txt";
    var num = document.createElement("b");
    num.textContent = q[0] + ".";
    txt.appendChild(num);
    txt.appendChild(document.createTextNode(q[1]));
    var term = document.createElement("p");
    term.className = "term";
    term.hidden = true;
    row.appendChild(input);
    row.appendChild(txt);
    row.appendChild(term);
    qsEl.appendChild(row);

    input.addEventListener("focus", function () { last = input; });
    input.addEventListener("input", function () {
      var v = input.value.toUpperCase().replace(/[^A-Z]/g, "").slice(0, 3);
      input.value = v;
      setAnswer(q[0], v);
    });
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); focusNext(input); }
    });
    return { q: q, row: row, input: input, term: term };
  });

  function focusNext(input) {
    var i = rows.findIndex(function (r) { return r.input === input; });
    if (i > -1 && rows[i + 1]) rows[i + 1].input.focus();
  }

  function setAnswer(n, v) {
    if (v) ans[n] = v; else delete ans[n];
    save();
    if (checked) { checked = false; clearMarks(); }
    refresh();
  }

  function pick(letter) {
    if (mode !== "quiz") return;
    var target = last || rows[0].input;
    var n = parseInt(target.id.slice(1), 10);
    target.value = letter;
    setAnswer(n, letter);
    focusNext(target);
  }

  function clearMarks() {
    rows.forEach(function (r) {
      r.row.classList.remove("ok", "bad");
      r.term.hidden = (mode !== "study");
      if (mode === "study") r.term.textContent = "= " + TERM[r.q[2]];
    });
    scoreEl.innerHTML = "&mdash;/40";
  }

  function refresh() {
    var used = {};
    var n = 0;
    Object.keys(ans).forEach(function (k) { used[ans[k]] = true; n++; });
    Object.keys(chips).forEach(function (l) {
      chips[l].classList.toggle("used", mode === "quiz" && !!used[l]);
    });
    if (mode === "quiz" && !checked) countEl.textContent = n + " of 40 answered";
  }

  function setMode(m) {
    mode = m;
    checked = false;
    app.setAttribute("data-mode", m);
    btnStudy.setAttribute("aria-pressed", String(m === "study"));
    btnQuiz.setAttribute("aria-pressed", String(m === "quiz"));
    btnCheck.hidden = btnClear.hidden = (m !== "quiz");
    rows.forEach(function (r) {
      r.row.classList.remove("ok", "bad");
      if (m === "study") {
        r.input.readOnly = true;
        r.input.tabIndex = -1;
        r.input.value = r.q[2];
        r.term.hidden = false;
        r.term.textContent = "= " + TERM[r.q[2]];
      } else {
        r.input.readOnly = false;
        r.input.tabIndex = 0;
        r.input.value = ans[r.q[0]] || "";
        r.term.hidden = true;
      }
    });
    Object.keys(chips).forEach(function (l) { chips[l].disabled = (m !== "quiz"); });
    scoreEl.innerHTML = "&mdash;/40";
    countEl.textContent = m === "study" ? "Answers shown. Switch to Quiz to test yourself." : "";
    refresh();
  }

  function check() {
    var right = 0;
    rows.forEach(function (r) {
      var given = ans[r.q[0]] || "";
      var want = r.q[2];
      var ok = given === want;
      if (ok) right++;
      r.row.classList.toggle("ok", ok);
      r.row.classList.toggle("bad", !ok);
      r.term.hidden = false;
      r.term.textContent = ok
        ? "✓ " + TERM[want]
        : "✗ Answer: " + want + " – " + TERM[want];
    });
    checked = true;
    scoreEl.textContent = right + "/40";
    countEl.textContent = right + " of 40 correct. Wrong ones show the answer.";
  }

  function clearAll() {
    ans = {};
    save();
    checked = false;
    rows.forEach(function (r) { r.input.value = ""; });
    clearMarks();
    rows.forEach(function (r) { r.term.hidden = true; });
    refresh();
    rows[0].input.focus();
  }

  btnStudy.addEventListener("click", function () { setMode("study"); });
  btnQuiz.addEventListener("click", function () { setMode("quiz"); });
  btnCheck.addEventListener("click", check);
  btnClear.addEventListener("click", clearAll);

  setMode("study");
})();
</script>

</body></html>
